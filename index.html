<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pazostack</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Mukta:wght@400;600;700&display=swap">
<style>
/* Layout: asphalt rail on the left (top strip on phones), working area beside it.
   Boldness lives in one place: the receivable "road sign" panel with its dashed centre line. */
:root{
  --bg:#E8E7E1; --surface:#F2F1EC; --raised:#FFFFFF; --ink:#1C2024; --ink2:#575D62; --line:#CBC9C0;
  --road:#22272C; --road-ink:#ECEAE3; --road-mute:#9AA0A5;
  --marking:#F5B800; --marking-ink:#241B00; --focus:#7A5800;
  --go:#1B7448; --go-bg:#DAEDE2; --warn:#8F5200; --warn-bg:#F8E6C4; --bad:#A8231B; --bad-bg:#F5D8D4;
  --in:#1B7448; --out:#6B7075;
  --display:'Barlow Condensed','Mukta',system-ui,sans-serif; --body:'Mukta','Noto Sans Devanagari',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171A; --surface:#1B1F23; --raised:#23282D; --ink:#ECEAE4; --ink2:#A3A8AC; --line:#394046;
  --road:#0E1012; --road-ink:#ECEAE3; --road-mute:#8C9297; --focus:#F5B800;
  --go:#5FC490; --go-bg:#16342A; --warn:#F0B34F; --warn-bg:#3B2D11; --bad:#F2918A; --bad-bg:#41211E;
  --in:#5FC490; --out:#8F959A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171A; --surface:#1B1F23; --raised:#23282D; --ink:#ECEAE4; --ink2:#A3A8AC; --line:#394046;
  --road:#0E1012; --road-ink:#ECEAE3; --road-mute:#8C9297; --focus:#F5B800;
  --go:#5FC490; --go-bg:#16342A; --warn:#F0B34F; --warn-bg:#3B2D11; --bad:#F2918A; --bad-bg:#41211E;
  --in:#5FC490; --out:#8F959A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);
  padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;max-width:1240px;margin:0 auto}
@media(min-width:900px){.app{grid-template-columns:220px minmax(0,1fr);align-items:start}.rail{position:sticky;top:16px}}
.rail{background:var(--road);color:var(--road-ink);border-radius:6px;padding:12px;min-width:0}
.brand{display:grid;gap:8px;padding:0 0 10px}
.brand .tile{background:#fff;border-radius:4px;padding:8px;display:grid;place-items:center}
.brand img{display:block;width:80%;max-width:800px;height:auto}
@media(max-width:899px){.brand{grid-template-columns:auto 1fr;align-items:center;gap:12px}.brand img{max-width:40px}}
.brand div.t{padding:0 4px;min-width:0}
.brand b{display:block;font-family:var(--display);font-size:22px;line-height:1.1;letter-spacing:.01em}
.brand small{display:block;color:var(--road-mute);font-size:12px;line-height:1.2;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
@media(min-width:900px){.nav{flex-direction:column;overflow:visible}}
.nav a{display:block;padding:7px 12px;border-radius:4px;text-decoration:none;color:#C7CBCD;white-space:nowrap;line-height:1.25}
.nav a .en{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--road-mute)}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a[aria-current="page"]{background:var(--marking);color:var(--marking-ink);font-weight:600}
.nav a[aria-current="page"] .en{color:#5C4500}
.mode{margin-top:10px;font-size:12px;color:var(--road-mute);padding:0 4px}
.mode.local{color:#F5B800}
main{min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px;margin-bottom:14px}
h1{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.1;letter-spacing:.005em}
h1 .en{display:block;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);font-family:var(--body);margin-top:2px}
h2{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.2}
h2 .en,.l .en,.en.s{font-size:.78em;color:var(--ink2);font-weight:400;font-family:var(--body)}
.sub{color:var(--ink2);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--raised);border-radius:4px;padding:7px 13px;cursor:pointer;font-weight:600;line-height:1.3}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--marking);border-color:var(--marking);color:var(--marking-ink)}
.btn.pri:hover{filter:brightness(.96)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.arm{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.5;cursor:default}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{background:none;border:0;padding:8px 14px;cursor:pointer;color:var(--ink2);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--marking)}
.panel{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:14px;min-width:0}
.panel>h2{margin-bottom:10px}
.grid{display:grid;gap:12px;min-width:0}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.tile{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0}
.tile .l{font-size:13px;color:var(--ink2);line-height:1.3}
.tile .v{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.15;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .d{font-size:12.5px;color:var(--ink2)}
.v.in{color:var(--in)} .v.bad{color:var(--bad)}
.hero{background:var(--road);color:var(--road-ink);border-radius:6px;padding:18px 20px;display:grid;gap:4px}
.hero .l{font-size:14px;color:var(--road-mute)}
.hero .big{font-family:var(--display);font-weight:700;font-size:clamp(40px,9vw,64px);line-height:1;color:var(--marking);font-variant-numeric:tabular-nums}
.hero hr{border:0;border-top:3px dashed var(--marking);margin:12px 0 8px;opacity:.85}
.hero .foot{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:14px;color:var(--road-ink)}
.hero .foot b{font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;text-align:left;color:var(--ink2);font-weight:600;padding:7px 10px;border-bottom:2px solid var(--line);white-space:nowrap;line-height:1.25}
th .en{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:400}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.nw{white-space:nowrap}
tr[data-edit],tr[data-open]{cursor:pointer}
tr[data-edit]:hover td,tr[data-open]:hover td{background:var(--surface)}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
.pill{display:inline-block;padding:0 8px;border-radius:3px;font-size:12px;font-weight:600;line-height:1.7;white-space:nowrap}
.pill.ok{background:var(--go-bg);color:var(--go)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.mute{background:var(--surface);color:var(--ink2);border:1px solid var(--line)}
.plate{display:inline-block;background:#F5C400;color:#111;border:2px solid #111;border-radius:4px;padding:0 8px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.06em;line-height:1.35;white-space:nowrap}
.filters{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;margin-bottom:12px}
.filters label{display:grid;gap:2px;font-size:12px;color:var(--ink2)}
.filters input,.filters select{padding:6px 8px}
input,select,textarea{background:var(--raised);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:60px}
input[aria-invalid="true"],select[aria-invalid="true"]{border-color:var(--bad)}
.filters input,.filters select{width:auto}
.empty{border:2px dashed var(--line);border-radius:6px;padding:28px 18px;text-align:center;color:var(--ink2);display:grid;gap:10px;justify-items:center}
.empty b{color:var(--ink);font-size:16px}
ul.plain{list-style:none;margin:0;padding:0;display:grid;gap:0}
ul.plain li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
ul.plain li:last-child{border-bottom:0}
ul.plain .t{flex:none}
.bar{height:8px;background:var(--surface);border:1px solid var(--line);border-radius:2px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--marking)}
.bar.go i{background:var(--go)}
.chart{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;align-items:end}
.chart .col{display:grid;gap:4px;justify-items:center;min-width:0}
.chart .pair{height:130px;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center;border-bottom:2px solid var(--line)}
.chart .b{width:min(40%,26px);min-height:2px;border-radius:2px 2px 0 0}
.chart .b.in{background:var(--in)} .chart .b.out{background:var(--out)}
.chart .m{font-size:12px;color:var(--ink2)}
.chart .f{font-size:11px;line-height:1.3;text-align:center;font-variant-numeric:tabular-nums}
.chart .f .a{color:var(--in);display:block} .chart .f .o{color:var(--ink2);display:block}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.card{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:14px;display:grid;gap:8px;align-content:start;min-width:0;cursor:pointer}
.card:hover{border-color:var(--ink2)}
.card h3{font-family:var(--display);font-size:20px;line-height:1.2}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:14px}
.kv dt{color:var(--ink2)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.kv dd.sum,.kv dt.sum{font-weight:700;border-top:1px solid var(--line);padding-top:3px;color:var(--ink)}
dl{margin:0}
.att td.c,.att th.c{min-width:32px;width:32px;text-align:center;padding:6px 0;user-select:none}
.att td.c{cursor:pointer;font-weight:700;font-size:13px}
.att td.c:hover{outline:2px solid var(--line);outline-offset:-2px}
.att td.P{background:var(--go-bg);color:var(--go)} .att td.A{background:var(--bad-bg);color:var(--bad)} .att td.H{background:var(--warn-bg);color:var(--warn)}
.att th.sun,.att td.sun:not(.P):not(.A):not(.H){background:var(--surface)}
.att th.today{color:var(--ink);box-shadow:inset 0 -3px 0 var(--marking)}
.att .nm{position:sticky;left:0;background:var(--raised);min-width:130px;z-index:1;box-shadow:1px 0 0 var(--line)}
.ov{position:fixed;inset:0;background:rgba(8,10,12,.58);display:flex;overflow:auto;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--raised);color:var(--ink);border-radius:8px;width:100%;max-width:660px;margin:auto;padding:18px;min-width:0}
.sheet.wide{max-width:820px}
.sheet h2{margin-bottom:12px;font-size:22px}
.ff{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.ff .fld{display:grid;gap:3px;align-content:start;min-width:0}
.ff .fld.full{grid-column:1/-1}
.ff .fld[hidden]{display:none}
.fld>span{font-size:13px;color:var(--ink2);line-height:1.25}
.fld>span b{color:var(--ink);font-weight:600}
.fld>span .req{color:var(--bad)}
.prev{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-top:12px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.acts .sp{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--road);color:var(--road-ink);padding:9px 16px;border-radius:6px;z-index:60;max-width:calc(100% - 32px);box-shadow:0 4px 16px rgba(0,0,0,.3);border:1px solid var(--marking)}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--ink2)}
.note{font-size:13px;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:3px;padding:1px 8px;font-size:13px;background:var(--raised)}
.neg{color:var(--bad)}
.sec{margin-top:18px}
.stack{display:grid;gap:14px;min-width:0}
@media(prefers-reduced-motion:no-preference){.sheet{animation:up .14s ease-out}@keyframes up{from{transform:translateY(8px);opacity:.4}}}
body{margin:0}

/* ───────── added sign-in screen ───────── */
body.auth-pending .app{display:none}
#auth-screen{display:none}
body.auth-pending #auth-screen{display:grid;min-height:100vh;place-items:center;padding:24px 16px}
.auth-card{width:min(100%,420px);background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:26px;box-shadow:0 12px 36px rgba(0,0,0,.10)}
.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.auth-brand img{width:60px;height:60px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px;padding:5px}
.auth-brand b{display:block;font-family:var(--display);font-size:26px;line-height:1.05;letter-spacing:.03em}
.auth-brand span{display:block;color:var(--ink2);font-size:12px;margin-top:3px}
.auth-card h1{font-size:28px;margin-bottom:5px}
.auth-card .auth-intro{color:var(--ink2);font-size:13px;margin-bottom:18px}
.auth-form{display:grid;gap:12px}
.auth-form label{display:grid;gap:4px;font-size:13px;color:var(--ink2)}
.auth-form button{width:100%;justify-content:center;margin-top:4px}
.auth-error{min-height:18px;color:var(--bad);font-size:13px;margin-top:2px}
.auth-loading{text-align:center;color:var(--ink2);padding:34px 10px}
.auth-user{display:grid;gap:7px;padding:12px 4px 2px;color:var(--road-mute);font-size:12px;overflow-wrap:anywhere}
.auth-user .btn{justify-content:center;background:transparent;border-color:#687078;color:var(--road-ink)}
@media(max-width:899px){.auth-user{display:flex;align-items:center;justify-content:space-between;gap:10px}}

</style>

</head>
<body class="auth-pending">
<div id="auth-screen" aria-live="polite"></div>
<div class="app">
  <aside class="rail" id="rail"></aside>
  <main id="main"></main>
</div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>

var chains={},active=0,waiting=[];
function limit(fn){return new Promise(function(res,rej){var run=function(){active++;fn().then(res,rej).then(function(){active--;if(waiting.length)waiting.shift()()})};active<4?run():waiting.push(run)})}
function enqueue(key,fn){var p=(chains[key]||Promise.resolve()).then(function(){return limit(fn)});chains[key]=p.catch(function(){});return p}
function fail(e){var c=e&&e.code;toast(c==='invalid_argument'?'बदल जतन झाला नाही — तुम्हाला फक्त पाहण्याची परवानगी आहे · No permission to edit':c==='quota_exceeded'?'साठवणीची मर्यादा संपली · Storage full':'जतन करता आले नाही · Could not save')}
function put(t,o){

  if(mode==='cloud'){var id=o.id;enqueue(t+'/'+id,function(){return dbh.collection(t).doc(id).set(JSON.parse(JSON.stringify(o)))}).catch(fail)}
  else lsSave(t);

}
function del(t,id){

}

      DB[t]=m;readyT[t]=true;
      if(booting&&TABLES.every(function(x){return readyT[x]}))booting=false;

/* ───────── business calculations ───────── */
function receiptsOf(billId){return L('receipts').filter(function(r){return r.billId===billId})}
function billCalc(b){
  var base=num(b.base),gst=base*num(b.gstPct)/100,total=base+gst;
  var sd=base*num(b.sdPct)/100,it=base*num(b.itPct)/100,gt=base*num(b.gstTdsPct)/100,cess=base*num(b.cessPct)/100,oth=num(b.other);
  var ded=sd+it+gt+cess+oth,net=total-ded;
  var rec=b.id?sum(receiptsOf(b.id),'amount'):0;
  return {base:base,gst:gst,total:total,sd:sd,it:it,gt:gt,cess:cess,oth:oth,ded:ded,net:net,rec:rec,due:net-rec};
}
function billStatus(c){return c.due<=0.5?['ok','मिळाले']:c.rec>0?['warn','अंशतः मिळाले']:['bad','बाकी']}
function siteStats(id){
  var billed=0,gross=0,rec=0,due=0;
  L('bills').filter(function(b){return b.siteId===id}).forEach(function(b){var c=billCalc(b);billed+=c.base;gross+=c.total;rec+=c.rec;due+=c.due});
  var exp=sum(L('expenses').filter(function(e){return e.siteId===id}),'amount');
  var veh=sum(L('vehicleLogs').filter(function(e){return e.siteId===id}),'amount');
  var lab=L('labourDays').filter(function(x){return x.siteId===id}).reduce(function(s,x){return s+num(x.days)*num(x.rate)},0);
  var cost=exp+veh+lab;
  return {billed:billed,gross:gross,rec:rec,due:due,exp:exp,veh:veh,lab:lab,cost:cost,profit:billed-cost};
}
function present(sid,m){var a=DB.att[sid+'_'+m];if(!a)return 0;return Object.keys(a.days||{}).reduce(function(s,k){var v=a.days[k];return s+(v==='P'?1:v==='H'?.5:0)},0)}
function earnedStaff(st,m){return Math.round(num(st.salary)/(num(cfg().basis)||30)*present(st.id,m))}
function paidIn(who,pid,m,kind){return L('payouts').filter(function(p){return p.who===who&&p.personId===pid&&(!m||String(p.date).indexOf(m)===0)&&(!kind||p.kind===kind)}).reduce(function(s,p){return s+num(p.amount)},0)}
function labourWage(id,m){return L('labourDays').filter(function(x){return x.labourId===id&&(!m||String(x.date).indexOf(m)===0)}).reduce(function(s,x){return s+num(x.days)*num(x.rate)},0)}
function labourDaysCount(id,m){return L('labourDays').filter(function(x){return x.labourId===id&&(!m||String(x.date).indexOf(m)===0)}).reduce(function(s,x){return s+num(x.days)},0)}
function stock(){
  var o={};PROD.forEach(function(p){o[p[0]]={name:p[1],made:0,out:0,key:p[0]}});
  L('crusherProd').forEach(function(r){PROD.forEach(function(p){o[p[0]].made+=num(r[p[0]])})});
  L('crusherSales').forEach(function(r){if(o[r.product])o[r.product].out+=num(r.qty)});
  return PROD.map(function(p){var x=o[p[0]];x.left=x.made-x.out;return x});
}
function cashIn(m){return sum(L('receipts').filter(function(r){return String(r.date).indexOf(m)===0}),'amount')+sum(L('crusherSales').filter(function(r){return r.kind==='Sale'&&String(r.date).indexOf(m)===0}),'paid')}
function cashOut(m){var f=function(t){return L(t).filter(function(r){return String(r.date).indexOf(m)===0})};return sum(f('expenses'),'amount')+sum(f('vehicleLogs'),'amount')+sum(f('payouts'),'amount')}
function vStats(v){
  var logs=L('vehicleLogs').filter(function(x){return x.vehicleId===v.id});
  var fuel=logs.filter(function(x){return x.kind==='Fuel'});
  var litres=sum(fuel,'litres'),fuelCost=sum(fuel,'amount'),rep=sum(logs.filter(function(x){return x.kind==='Repair'}),'amount');
  var rd=logs.map(function(x){return num(x.meter)}).filter(function(x){return x>0});
  var span=rd.length>1?Math.max.apply(null,rd)-Math.min.apply(null,rd):0;
  var eff=span>0&&litres>0?(v.meterUnit==='km'?span/litres:litres/span):null;
  var nd=logs.map(function(x){return x.nextDue}).filter(Boolean).sort().pop();
  return {litres:litres,fuelCost:fuelCost,rep:rep,span:span,eff:eff,nextDue:nd,hours:sum(logs.filter(function(x){return x.kind==='Work'}),'hours')};
}

function showLogin(message){

  var first=$('auth-screen').querySelector('input[name="username"]');if(first)first.focus();
}
function startApp(){
  document.body.classList.remove('auth-pending');
  $('auth-screen').innerHTML='';
  lsLoad();
  route();
  if(booting){
    window.claude.use('db').then(function(d){
      if(!d){booting=false;mode='local';render();return}
      dbh=d;mode='cloud';DB={};TABLES.forEach(function(t){DB[t]={}});subscribeAll();
      setTimeout(function(){if(booting){booting=false;render()}},6000);
    }).catch(function(){booting=false;render()});
  }
}
function startAuth(){
  document.body.classList.add('auth-pending');
  $('auth-screen').innerHTML='<section class="auth-card"><div class="auth-brand"><img src="'+LOGO+'" alt="Pazo logo"><div><b>PAZOSTACK</b><span>Londhe and Company</span></div></div><div class="auth-loading">Checking sign-in…</div></section>';
  fetch('/api/auth/session',{method:'GET',credentials:'same-origin',cache:'no-store',headers:{'Accept':'application/json'}})
    .then(function(r){return r.json().then(function(d){return {ok:r.ok,data:d}})})
    .then(function(result){
      if(result.ok&&result.data&&result.data.authenticated){authUser=result.data.user||null;startApp()}
      else showLogin(result.data&&result.data.error?result.data.error:'');
    })
    .catch(function(){showLogin('Could not reach the sign-in service. Open the deployed Vercel website and try again.')});
}
function submitLogin(form){
  var button=form.querySelector('button[type="submit"]'),error=$('login-error');
  if(button){button.disabled=true;button.textContent='Signing in…'}
  if(error)error.textContent='';
  fetch('/api/auth/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({username:form.elements.username.value.trim(),password:form.elements.password.value})})
    .then(function(r){return r.json().catch(function(){return {}}).then(function(d){return {ok:r.ok,data:d}})})
    .then(function(result){
      if(!result.ok){if(error)error.textContent=result.data.error||'Sign-in failed. Check your username and password.';return}
      authUser=result.data.user||null;startApp();
    })
    .catch(function(){if(error)error.textContent='Unable to contact the sign-in service. Please try again.'})
    .then(function(){if(button&&button.isConnected){button.disabled=false;button.textContent='Sign in'}});
}
function logoutUser(){
  fetch('/api/auth/logout',{method:'POST',credentials:'same-origin',headers:{'Accept':'application/json'}})
    .catch(function(){})
    .then(function(){authUser=null;showLogin('You have been signed out.')});
}

    window.claude.use('downloads').then(function(d){
      if(!d){toast('फाइल डाउनलोड करता आली नाही');return}
      return d.save({filename:x.name+'-'+todayS()+'.csv',data:csv}).then(function(){toast('फाइल जतन झाली')}).catch(function(e){if(!e||e.code!=='declined')toast('फाइल जतन करता आली नाही')});
    }).catch(function(){toast('फाइल डाउनलोड करता आली नाही')});
    return;
  }
  try{
    var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download=x.name+'-'+todayS()+'.csv';a.style.display='none';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},1000);
    toast('CSV डाउनलोड सुरू झाले ✓');
  }catch(e){toast('फाइल डाउनलोड करता आली नाही')}
}

/* ───────── events ───────── */
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act],[data-edit],[data-open]');
  if(!el)return;
  var a=el.getAttribute('data-act');
  if(!a){
    if(ev.target.closest('button,a,input,select')&&!el.matches('button'))return;
    var ed=el.getAttribute('data-edit');if(ed){var p=ed.split(':');openForm(p[0],p[1]);return}
    var op=el.getAttribute('data-open');if(op){var q=op.split(':');if(q[0]==='site')openSite(q[1]);else openBill(q[1])}
    return;
  }
  if(a==='logout'){logoutUser()}
  else if(a==='add'){var pre=el.getAttribute('data-preset');openForm(el.getAttribute('data-ent'),null,pre?JSON.parse(pre):null)}
  else if(a==='close'){closeModal()}
  else if(a==='cancelForm'){var b=S.formBack;S.formBack=null;closeModal();if(b)reopen(b)}
  else if(a==='tab'){S.tab[el.getAttribute('data-v')]=el.getAttribute('data-t');render()}
  else if(a==='allmonths'){S.month='';render()}
  else if(a==='att'){
    var sid=el.getAttribute('data-s'),d=el.getAttribute('data-d'),m=curM(),id=sid+'_'+m,cur=DB.att[id]||{id:id,staffId:sid,month:m,days:{}};
    var days=Object.assign({},cur.days),v=days[d]||'',nx={'':'P','P':'H','H':'A','A':''}[v];if(nx)days[d]=nx;else delete days[d];
    put('att',Object.assign({},cur,{days:days}));render();
  }
  else if(a==='allpresent'){
    var m2=curM(),d2=String(new Date().getDate());
    L('staff').filter(function(s){return s.status!=='Left'}).forEach(function(s){var id=s.id+'_'+m2,cur=DB.att[id]||{id:id,staffId:s.id,month:m2,days:{}};if(!cur.days[d2]){var dd=Object.assign({},cur.days);dd[d2]='P';put('att',Object.assign({},cur,{days:dd}))}});render();toast('आज सर्वांना हजर केले');
  }
  else if(a==='pay'){
    var who=el.getAttribute('data-who'),amt=el.getAttribute('data-amt');
    openForm('payouts',null,{who:who,personId:el.getAttribute('data-id'),kind:el.getAttribute('data-kind'),amount:amt?+amt:'',date:todayS()});
  }
  else if(a==='delete'){
    if(el.classList.contains('arm')){doDelete(el.getAttribute('data-ent'),el.getAttribute('data-id'))}
    else{el.classList.add('arm');el.textContent='खात्री? पुन्हा दाबा';setTimeout(function(){if(el.isConnected){el.classList.remove('arm');el.textContent='हटवा'}},4000)}
  }
  else if(a==='muster'){openMuster()}
  else if(a==='musterall'){document.querySelectorAll('.mday').forEach(function(i){i.value=1})}
  else if(a==='musterSave'){
    var date=$('mdate').value,site=$('msite').value,n=0;
    if(!date||!site){toast('तारीख व साइट निवडा');return}
    document.querySelectorAll('.mday').forEach(function(i){var dv=num(i.value);if(dv>0){var w=DB.labour[i.getAttribute('data-w')];put('labourDays',{date:date,labourId:w.id,siteId:site,days:dv,rate:num(w.rate)});n++}});
    closeModal();render();toast(n+' मजुरांची नोंद झाली ✓');
  }
  else if(a==='export'){exportCSV(el.getAttribute('data-k'))}
  else if(a==='sample'){toast('नमुना माहिती भरत आहे…');makeSample();render();setTimeout(function(){toast('नमुना माहिती भरली ✓')},600)}
  else if(a==='nosample'){clearSample();render();toast('नमुना माहिती काढली')}
});
document.addEventListener('change',function(ev){
  var el=ev.target,f=el.getAttribute&&el.getAttribute('data-f');
  if(f){if(f==='month')S.month=el.value;else S[f]=el.value;render();return}
  var form=el.closest&&el.closest('#frm');

    if(form.getAttribute('data-ent')==='labourDays'&&el.id==='f_labourId'){var w=DB.labour[el.value];if(w)$('f_rate').value=w.rate}
    refreshForm(form);
  }
});

});
